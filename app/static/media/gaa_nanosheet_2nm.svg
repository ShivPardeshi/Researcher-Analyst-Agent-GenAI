<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="semiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f29"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#semiBg)"/>

  <!-- Title -->
  <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f5f3ff">2nm Gate-All-Around (GAA) &amp; CoWoS Packaging Architecture</text>
  <text x="60" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#c4b5fd">TSMC / Intel GAA Nanosheet Channels &amp; 2.5D Interposer Integration • Global Semi Consortium</text>

  <!-- Left: FinFET (3-sided gate) -->
  <g transform="translate(80, 110)">
    <rect width="280" height="230" rx="12" fill="#241b3a" stroke="#4c1d95" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#e9d5ff">Legacy FinFET (3nm/5nm)</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#a78bfa">3-sided gate contact, higher subthreshold leakage</text>

    <!-- Substrate -->
    <rect x="30" y="180" width="220" height="30" rx="4" fill="#3b2d54"/>
    <text x="110" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">Silicon Substrate</text>

    <!-- Vertical Fin -->
    <rect x="125" y="85" width="30" height="95" rx="3" fill="#6366f1"/>
    <!-- Gate wrapping 3 sides -->
    <path d="M 105 140 L 105 80 L 175 80 L 175 140" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
    <text x="75" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f43f5e">3-Sided Gate</text>
  </g>

  <!-- Right: 2nm GAA Nanosheets (4-sided gate) -->
  <g transform="translate(420, 110)">
    <rect width="310" height="230" rx="12" fill="#241b3a" stroke="#8b5cf6" stroke-width="2"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f5f3ff">Next-Gen GAA Nanosheet (2nm/A16)</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#c4b5fd">Full 360° 4-sided gate wrap, 25-30% power reduction</text>

    <!-- Substrate -->
    <rect x="30" y="180" width="250" height="30" rx="4" fill="#3b2d54"/>
    <text x="125" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">Silicon Substrate</text>

    <!-- 3 Horizontal Nanosheets -->
    <rect x="90" y="80" width="130" height="12" rx="4" fill="#38bdf8"/>
    <rect x="90" y="110" width="130" height="12" rx="4" fill="#38bdf8"/>
    <rect x="90" y="140" width="130" height="12" rx="4" fill="#38bdf8"/>

    <!-- 4-sided Gate surrounds all sheets -->
    <rect x="70" y="70" width="170" height="92" rx="6" fill="url(#gateGrad)" opacity="0.35" stroke="#d946ef" stroke-width="2"/>
    <text x="80" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f472b6">All-Around 360° Dielectric Gate</text>
  </g>

  <!-- Metrics row -->
  <g transform="translate(60, 365)">
    <rect x="0" y="0" width="215" height="80" rx="8" fill="#1e1633" stroke="#4c1d95" stroke-width="1"/>
    <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#a78bfa">+15%</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#ddd6fe">Performance gain at iso-power</text>

    <rect x="235" y="0" width="220" height="80" rx="8" fill="#1e1633" stroke="#4c1d95" stroke-width="1"/>
    <text x="251" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">-30%</text>
    <text x="251" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#ddd6fe">Power consumption reduction</text>

    <rect x="475" y="0" width="205" height="80" rx="8" fill="#1e1633" stroke="#4c1d95" stroke-width="1"/>
    <text x="491" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f43f5e">1,000W+</text>
    <text x="491" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#ddd6fe">TDP necessitating liquid cooling</text>
  </g>
</svg>
