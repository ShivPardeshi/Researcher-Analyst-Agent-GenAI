<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barGradMuted" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid lines -->
  <path d="M 60 100 L 740 100 M 60 170 L 740 170 M 60 240 L 740 240 M 60 310 L 740 310 M 60 380 L 740 380" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Header Section -->
  <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Multi-Agent Reasoning Benchmarks vs. Monolithic LLMs</text>
  <text x="60" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Empirical Evaluation of Specialized Agents (Research • Verification • Synthesis) • Source: AI Systems Institute 2025-2026</text>

  <!-- Chart Metrics -->
  <!-- Metric 1: Factual Consistency -->
  <text x="60" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Factual Consistency Score</text>
  
  <!-- Monolithic Bar -->
  <rect x="60" y="145" width="310" height="26" rx="6" fill="url(#barGradMuted)"/>
  <text x="380" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">58.2% (Monolithic Single-Prompt)</text>
  
  <!-- Multi-Agent Bar -->
  <rect x="60" y="180" width="540" height="26" rx="6" fill="url(#barGrad2)"/>
  <text x="610" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">94.6% (+36.4% Multi-Agent Team)</text>

  <!-- Metric 2: Factual Hallucination Rate (Lower is better) -->
  <text x="60" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Factual Hallucination Rate (Lower is Superior)</text>
  
  <!-- Monolithic Bar -->
  <rect x="60" y="260" width="280" height="26" rx="6" fill="#ef4444" opacity="0.85"/>
  <text x="350" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#fca5a5">28.4% (Standard Single-Turn)</text>
  
  <!-- Multi-Agent Bar -->
  <rect x="60" y="295" width="80" height="26" rx="6" fill="url(#barGrad1)"/>
  <text x="150" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#60a5fa">4.1% (-85% Absolute / -42% Relative Reduction)</text>

  <!-- Stat Cards at Bottom -->
  <!-- Card 1 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="355" width="205" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#38bdf8">88.3%</text>
    <text x="80" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Synthetic Assertions Intercepted by Verifier</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#cardShadow)">
    <rect x="295" y="355" width="205" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="315" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#34d399">1.8x</text>
    <text x="315" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Average Latency Overhead vs. Single-Turn</text>
  </g>

  <!-- Card 3 -->
  <g filter="url(#cardShadow)">
    <rect x="530" y="355" width="210" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="550" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#a78bfa">3 Agents</text>
    <text x="550" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Sequential Pipeline Handoff Architecture</text>
  </g>
</svg>
